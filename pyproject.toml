[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-ch2-demo"
version = "1.0.0"
description = "Учебная лаборатория: индексация данных, глава 2 Learning LangChain"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langchain-core>=1,<2", "langchain-openai>=1,<2",
  "langchain-community>=0.4,<0.5", "langchain-classic>=1,<2",
  "langchain-text-splitters>=1,<2", "langchain-chroma>=1,<2",
  "python-dotenv>=1,<2", "pypdf>=6,<7", "beautifulsoup4>=4,<5", "sqlalchemy[asyncio]>=2,<3"
]
[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10"]
[project.scripts]
chapter2 = "chapter2.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
